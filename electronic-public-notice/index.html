<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>電子公告</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25313a;
      --muted: #6f7a80;
      --line: #dfe5e7;
      --paper: #ffffff;
      --background: #f4f6f5;
      --accent: #315f68;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font-family: Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.8;
    }
    main {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 72px 0 88px;
    }
    .page-header {
      border-top: 4px solid var(--accent);
      padding: 22px 4px 28px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 600;
      letter-spacing: .04em;
    }
    .notice {
      margin-top: 24px;
      padding: 30px 32px 34px;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(35, 52, 57, .06);
    }
    h2 {
      margin: 0;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
      color: var(--accent);
      font-size: 21px;
      font-weight: 600;
    }
    .notice p { margin: 24px 0 0; }
    .notice dl {
      margin: 28px 0 0;
      border-top: 1px solid var(--line);
    }
    .notice dl div {
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 20px;
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
    }
    dt { font-weight: 700; }
    dd { margin: 0; }
    footer {
      margin-top: 26px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 560px) {
      main { width: min(100% - 24px, 760px); padding-top: 40px; }
      .notice { padding: 24px 20px 28px; }
      .notice dl div { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <p class="eyebrow">PUBLIC NOTICE</p>
      <h1>電子公告</h1>
    </header>

    <section class="notice" aria-labelledby="notice-title">
      <h2 id="notice-title">ご自身でホームページに電子公告を掲載</h2>
      <p>設立前に公告用ホームページを用意し、ご自身で管理いただきます。</p>
      <dl>
        <div>
          <dt>費用</dt>
          <dd>ホームページ維持費用</dd>
        </div>
        <div>
          <dt>公告掲載までの所要時間</dt>
          <dd>ホームページ掲載の作業時間</dd>
        </div>
      </dl>
    </section>

    <footer>電子公告に関する情報を掲載する公開ページです。</footer>
  </main>
</body>
</html>
