<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>木の子交通｜研修ページ</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#faf3e5;color:#423329;font-family:"Hiragino Sans","Yu Gothic",Arial,sans-serif}main{width:min(100%,440px);padding:36px 30px;background:#fffdf8;border:1px solid #d6c5aa;border-top:4px solid #a58761;box-shadow:0 10px 32px rgba(62,42,24,.10)}h1{font-size:22px;line-height:1.5;margin:0 0 9px}.sub{font-size:15px;line-height:1.7;color:#6c5744;margin:0 0 25px}label{display:block;font-weight:700;font-size:15px;margin-bottom:9px}input{font:inherit;width:100%;height:48px;padding:10px 12px;background:#fff;border:1px solid #9c8160;border-radius:4px;color:#423329}button{font:inherit;width:100%;min-height:48px;margin-top:16px;border:0;border-radius:4px;color:#fff;background:#64452f;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}input:focus-visible,button:focus-visible{outline:3px solid #906a3c;outline-offset:3px}#status{font-size:14px;line-height:1.65;margin:16px 0 0;min-height:24px;color:#7b302a}@media(max-width:450px){main{padding:28px 20px}h1{font-size:20px}}
</style></head><body><main><h1>木の子交通｜乗務員研修</h1><p class="sub">パスワードを入力して、研修ページを開いてください。</p><form id="unlock"><label for="password">パスワード</label><input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required><button id="go" type="submit">研修ページを開く</button></form><p id="status" role="status" aria-live="polite"></p></main>
<script>
(()=>{const SALT=Uint8Array.from(atob('1JVVHrvdWZdnIfeSOnUX2cOMiTLYWMEtTUhptgEkg1k='),x=>x.charCodeAt(0));const IV=Uint8Array.from(atob('Hoea2V+VIYTLbsBG'),x=>x.charCodeAt(0));const ITERATIONS=900000;const AAD=new TextEncoder().encode('kinoko-training-B-v1');const form=document.getElementById('unlock'),input=document.getElementById('password'),button=document.getElementById('go'),status=document.getElementById('status');let payloadPromise;
form.addEventListener('submit',async e=>{e.preventDefault();if(!input.value)return;button.disabled=true;status.textContent='確認しています。少しお待ちください。';const password=input.value;input.value='';try{if(!window.crypto?.subtle||!window.DecompressionStream)throw new Error('unsupported');payloadPromise??=fetch('./payload.bin',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('network');return r.arrayBuffer()});const payload=await payloadPromise;const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:ITERATIONS,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:IV,additionalData:AAD},key,payload);status.textContent='ページを開いています…';const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));const page=await new Response(stream).text();document.open();document.write(page);document.close();}catch(err){status.textContent=err.message==='unsupported'?'このブラウザでは開けません。新しいChromeまたはSafariをお使いください。':err.message==='network'?'読み込みに失敗しました。通信環境を確認してください。':'パスワードが違います。もう一度お試しください。';button.disabled=false;input.focus();}});
})();
</script></body></html>
